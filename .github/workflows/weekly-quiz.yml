name: Weekly current-affairs quiz

on:
  schedule:
    # Sunday 00:30 in India (Saturday 19:00 UTC): the quiz of the Sunday that
    # just began, from the stories of the 7 days before it.
    - cron: '0 19 * * 6'
  workflow_dispatch:

concurrency:
  group: ca-weekly-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # supabase-js needs Node 22+ (native WebSocket)
          cache: npm
      - run: npm ci --omit=dev
      - name: Run the weekly quiz generator
        run: node scripts/generateWeeklyQuiz.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CA_PIPELINE_ENABLED: 'true'
          CA_TIME_ZONE: Asia/Kolkata
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca-quiz-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
