name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # supabase-js needs Node 22+ (native WebSocket); Render runs Node 24.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit / integration tests
        run: npm test --if-present -- --ci
      - name: Build sanity (syntax check)
        run: node --check index.js
